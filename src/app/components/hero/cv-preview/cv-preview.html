<div
  class="modal-overlay cv-preview-overlay"
  [class.open]="isOpen()"
  [attr.aria-hidden]="!isOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="CV preview"
  (click)="onOverlayClick($event)"
>
  <div class="cv-preview" #dialog>
    <div class="cv-preview-bar">
      <span class="cv-preview-title">Emmanuel Nzibuka</span>
      <div class="cv-preview-actions">
        <a
          class="btn btn-secondary btn-sm"
          href="assets/Emmanuel-Nzibuka-CV.pdf"
          target="_blank"
          rel="noopener"
        >Open in new tab</a>
        <a class="btn btn-primary btn-sm" href="assets/Emmanuel-Nzibuka-CV.pdf" download>Download</a>
        <button class="modal-close" aria-label="Close CV preview" (click)="close.emit()">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <iframe
      class="cv-preview-frame"
      src="assets/Emmanuel-Nzibuka-CV.pdf"
      title="Emmanuel Nzibuka's CV preview"
    ></iframe>
  </div>
</div>

<section class="hero" id="home">
  <svg class="hero-bg" viewBox="0 0 800 600" aria-hidden="true" style="animation: drift 14s ease-in-out infinite;">
    <defs>
      <radialGradient id="g1" cx="30%" cy="20%" r="60%">
        <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g2" cx="80%" cy="70%" r="55%">
        <stop offset="0%" stop-color="#ff8f66" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#ff8f66" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="800" height="600" fill="url(#g1)"/>
    <rect width="800" height="600" fill="url(#g2)"/>
  </svg>

  <div class="container hero-grid">
    <div class="hero-stagger">
      <div class="hero-eyebrow"><span class="dot" aria-hidden="true"></span> Available for opportunities</div>
      <h1>Hi, I'm <span class="accent">Emmanuel Nzibuka</span></h1>
      <p class="hero-tagline" style="font-weight:600; color:var(--text-primary); font-size:1.05rem; max-width:none;">Full-Stack Developer | Angular · Node.js · Express</p>
      <p class="hero-tagline">I build fast, accessible, full-stack web applications end to end — from the API to a polished UI.</p>
      <div class="hero-ctas">
        <a href="#projects" class="btn btn-primary">View My Work</a>
        <a href="assets/Emmanuel-Nzibuka-CV.pdf" class="btn btn-secondary" download>Download CV</a>
        <a href="#contact" class="btn btn-ghost">Contact Me</a>
      </div>
      <div class="hero-socials">
        <a class="icon-btn" href="https://github.com/nzibukaemmanuel" target="_blank" rel="noopener" aria-label="GitHub profile" title="GitHub">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.79-.25.79-.55v-2.15c-3.2.7-3.88-1.34-3.88-1.34-.53-1.32-1.28-1.67-1.28-1.67-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.07.78 2.15v3.19c0 .3.21.66.79.55A10.51 10.51 0 0023.5 12c0-6.27-5.23-11.5-11.5-11.5z"/></svg>
        </a>
        <a class="icon-btn" href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn profile" title="LinkedIn">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 11-.02 5 2.5 2.5 0 01.02-5zM.5 8.98h4.96V23H.5zM8.98 8.98h4.76v1.92h.07c.66-1.25 2.28-2.57 4.7-2.57 5.02 0 5.95 3.3 5.95 7.6V23h-4.97v-6.34c0-1.51-.03-3.46-2.11-3.46-2.11 0-2.43 1.65-2.43 3.35V23H8.98z"/></svg>
        </a>
        <a class="icon-btn" href="mailto:hello@emmanuelnzibuka.dev" aria-label="Send an email" title="Email">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
        </a>
      </div>
    </div>

    <div class="hero-stagger">
      <div class="terminal">
        <div class="terminal-bar">
          <span class="terminal-dot red"></span>
          <span class="terminal-dot yellow"></span>
          <span class="terminal-dot green"></span>
          <span class="terminal-title">engineer.js</span>
        </div>
        <pre class="terminal-body" aria-label="Illustrative code snippet describing Emmanuel's focus" [innerHTML]="terminalHtml()"></pre>
      </div>
    </div>
  </div>
</section>

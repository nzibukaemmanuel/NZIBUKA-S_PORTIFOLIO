<section style="background:var(--bg-subtle);">
  <div class="container">
    <div class="section-head reveal" appReveal>
      <span class="section-eyebrow">09 — Certifications</span>
      <h2>Certificates earned</h2>
    </div>
    <ul class="cert-grid">
      @for (cert of certifications; track cert.title) {
        <li class="card cert-card reveal" appReveal>
          <div class="cert-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 15l-5.5 3 1.5-6-4.5-4 6-.5L12 2l2.5 5.5 6 .5-4.5 4 1.5 6z"/></svg>
          </div>
          <div>
            <h3>{{ cert.title }}</h3>
            <p class="issuer">{{ cert.issuer }}</p>
            <span class="date">{{ cert.date }}</span><br/>
            <a href="#" [attr.aria-label]="'View credential for ' + cert.title">View credential →</a>
          </div>
        </li>
      }
    </ul>
  </div>
</section>

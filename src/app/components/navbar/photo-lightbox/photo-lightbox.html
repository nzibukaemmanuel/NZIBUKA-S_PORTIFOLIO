<div
  class="modal-overlay photo-lightbox-overlay"
  [class.open]="isOpen()"
  [attr.aria-hidden]="!isOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="Profile picture"
  (click)="onOverlayClick($event)"
>
  <div class="photo-lightbox" #dialog>
    <button class="modal-close" aria-label="Close profile picture" (click)="close.emit()">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <img src="images/profile.jpg" alt="Profile photo of Emmanuel Nzibuka" />
  </div>
</div>

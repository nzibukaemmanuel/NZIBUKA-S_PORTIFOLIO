<a href="#main" class="skip-link">Skip to main content</a>

<header class="navbar">
  <div class="container navbar-inner">
    <div class="brand-group">
      <button
        class="brand-photo-trigger"
        type="button"
        aria-label="View profile picture"
        (click)="isLightboxOpen.set(true)"
      >
        <img
          class="brand-mark brand-photo"
          src="images/profile.jpg"
          alt="Emmanuel Nzibuka"
          width="32"
          height="32"
        />
      </button>
      <a href="#home" class="brand" aria-label="Emmanuel Nzibuka, home" (click)="navigate('#home')">
        <span class="brand-name">Emmanuel Nzibuka</span>
      </a>
    </div>

    <nav class="nav-links" aria-label="Primary">
      @for (link of navLinks; track link.target) {
        <a [href]="link.target" (click)="$event.preventDefault(); navigate(link.target)">{{ link.label }}</a>
      }
    </nav>

    <div class="nav-actions">
      <button
        class="kbd-hint"
        aria-haspopup="dialog"
        aria-controls="cmdk-overlay"
        (click)="commandPalette.open()"
      >
        <span>Search</span><kbd>⌘K</kbd>
      </button>
      <button
        class="icon-btn search-trigger-mobile"
        aria-label="Open command palette"
        aria-haspopup="dialog"
        aria-controls="cmdk-overlay"
        (click)="commandPalette.open()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>

      <div class="theme-toggle navbar-theme-toggle" role="group" aria-label="Theme">
        <button
          [class.active]="theme.mode() === 'light'"
          [attr.aria-pressed]="theme.mode() === 'light'"
          aria-label="Light theme"
          (click)="setTheme('light')"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button
          [class.active]="theme.mode() === 'system'"
          [attr.aria-pressed]="theme.mode() === 'system'"
          aria-label="System theme"
          (click)="setTheme('system')"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
        <button
          [class.active]="theme.mode() === 'dark'"
          [attr.aria-pressed]="theme.mode() === 'dark'"
          aria-label="Dark theme"
          (click)="setTheme('dark')"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
        </button>
      </div>

      <button
        class="nav-toggle icon-btn"
        [attr.aria-label]="isMobileMenuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="mobile-menu"
        (click)="toggleMobileMenu()"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <nav class="mobile-menu" [class.open]="isMobileMenuOpen()" id="mobile-menu" aria-label="Mobile">
    @for (link of navLinks; track link.target) {
      <a [href]="link.target" (click)="$event.preventDefault(); navigate(link.target)">{{ link.label }}</a>
    }
    <div class="theme-toggle mobile-theme-toggle" role="group" aria-label="Theme">
      <button
        [class.active]="theme.mode() === 'light'"
        [attr.aria-pressed]="theme.mode() === 'light'"
        aria-label="Light theme"
        (click)="setTheme('light')"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button
        [class.active]="theme.mode() === 'system'"
        [attr.aria-pressed]="theme.mode() === 'system'"
        aria-label="System theme"
        (click)="setTheme('system')"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button
        [class.active]="theme.mode() === 'dark'"
        [attr.aria-pressed]="theme.mode() === 'dark'"
        aria-label="Dark theme"
        (click)="setTheme('dark')"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
    </div>
  </nav>
</header>

<app-photo-lightbox [isOpen]="isLightboxOpen()" (close)="isLightboxOpen.set(false)" />
